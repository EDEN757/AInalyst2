[project]
name = "ainalyst2"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.22.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    "faiss-cpu>=1.7.4",
    "requests>=2.28.0",
    "python-dateutil>=2.8.2",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
